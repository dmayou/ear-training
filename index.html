<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-KQLN43TDJJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-KQLN43TDJJ');
  </script>

  <title>smarter-ear</title>

  <!-- Favicons / app icons (files live at the web root). -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#ffffff" />

  <link rel="stylesheet" href="styles.css" />

  <!-- CDN dependencies, resolved by ES modules via this import map (no build step). -->
  <script type="importmap">
  {
    "imports": {
      "tone": "https://esm.sh/tone@15.0.4?bundle",
      "vexflow": "https://cdn.jsdelivr.net/npm/vexflow@4.2.2/+esm"
    }
  }
  </script>
</head>
<body>
  <main id="app">
    <!-- Mode-select screen -->
    <section id="mode-select" class="screen">
      <div class="brand">
        <img class="logo" src="/logo.svg" width="140" height="140"
             alt="smarter-ear logo: an ear with a musical note and sound waves" />
        <h1>smarter-ear</h1>
      </div>
      <p class="subtitle">Choose a practice mode</p>
      <div class="mode-buttons">
        <button class="mode-btn" data-mode="intervals">Intervals</button>
        <button class="mode-btn" data-mode="chords">Chords</button>
        <button class="mode-btn" data-mode="scales">Scales</button>
      </div>
    </section>

    <!-- Round screen (populated by game.js) -->
    <section id="round" class="screen hidden">
      <h2 id="prompt" class="prompt"></h2>
      <div id="staff" aria-label="Music staff"></div>
      <div id="choices" class="choices"></div>
      <div id="actions" class="actions hidden">
        <button id="replay-btn" type="button">Listen again</button>
        <button id="next-btn" type="button">Next</button>
      </div>
      <button id="back-btn" type="button">Change practice mode</button>
      <img class="logo-footer" src="/logo.svg" width="72" height="72"
           alt="smarter-ear" />
    </section>
  </main>

  <script type="module" src="src/game.js"></script>
</body>
</html>
